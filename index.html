<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subsecretaría de Recursos Humanos | Portal Principal</title>
<style>
  /* ===== RESET & BASE ===== */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --azul-oscuro: #0a1a3c;
    --azul-medio: #123a7a;
    --azul-brillante: #2a6df4;
    --azul-neon: #4d9fff;
    --dorado: #d4af37;
    --dorado-claro: #f5e6a8;
    --blanco: #ffffff;
    --texto-claro: #e8eefc;
    --sombra-glow: 0 0 30px rgba(42, 109, 244, 0.45);
  }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at 20% 20%, #16336b 0%, #0a1a3c 45%, #050d20 100%);
    color: var(--texto-claro);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 100vh;
  }

  /* ===== FONDO ANIMADO ===== */
  .bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
    animation: flotar 18s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #2a6df4, transparent 70%);
    top: -160px; left: -140px;
    animation-duration: 20s;
  }
  .orb-2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #d4af37, transparent 70%);
    bottom: -180px; right: -120px;
    animation-duration: 24s;
    animation-delay: -6s;
    opacity: 0.18;
  }
  .orb-3 {
    width: 360px; height: 360px;
    background: radial-gradient(circle, #4d9fff, transparent 70%);
    top: 40%; left: 55%;
    animation-duration: 22s;
    animation-delay: -12s;
    opacity: 0.2;
  }

  @keyframes flotar {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(40px, -30px) scale(1.12); }
    100% { transform: translate(-30px, 40px) scale(0.95); }
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(77, 159, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 159, 255, 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: moverGrid 30s linear infinite;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  @keyframes moverGrid {
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: 60px 60px, 60px 60px; }
  }

  /* ===== CONTENEDOR PRINCIPAL ===== */
  .contenedor {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1200px;
    padding: 20px 24px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    justify-content: center;
    gap: 18px;
  }

  /* ===== ENCABEZADO ===== */
  .encabezado {
    text-align: center;
    animation: aparecerArriba 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -30px; /* 👈 sube el bloque completo del encabezado */
  }

  /* ===== LOGO GRANDE CON ANIMACIÓN ===== */
  .logo-rrhh {
    width: clamp(220px, 30vw, 380px);
    height: auto;
    display: block;
    margin: 0 auto 35px; /* 👈 35px de aire entre logo y título */
    pointer-events: none;
    user-select: none;
    filter:
      drop-shadow(0 0 18px rgba(212, 175, 55, 0.55))
      drop-shadow(0 0 40px rgba(42, 109, 244, 0.45))
      drop-shadow(0 0 80px rgba(77, 159, 255, 0.25));
    animation:
      logoFlota 5s ease-in-out infinite,
      logoBalanceo 8s ease-in-out infinite,
      logoBrillo 4s ease-in-out infinite;
    transform-origin: center center;
    will-change: transform, filter;
  }

  @keyframes logoFlota {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }

  @keyframes logoBalanceo {
    0%, 100% { rotate: -1.5deg; }
    50%      { rotate: 1.5deg; }
  }

  @keyframes logoBrillo {
    0%, 100% {
      filter:
        drop-shadow(0 0 18px rgba(212, 175, 55, 0.55))
        drop-shadow(0 0 40px rgba(42, 109, 244, 0.45))
        drop-shadow(0 0 80px rgba(77, 159, 255, 0.25));
    }
    50% {
      filter:
        drop-shadow(0 0 30px rgba(212, 175, 55, 0.9))
        drop-shadow(0 0 60px rgba(42, 109, 244, 0.75))
        drop-shadow(0 0 120px rgba(77, 159, 255, 0.5));
    }
  }

  .encabezado h1 {
    font-size: clamp(1.5rem, 3.2vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.5px;
    line-height: 1.15;
    background: linear-gradient(100deg, #ffffff 0%, #cfe0ff 40%, #f5e6a8 70%, #ffffff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: brilloTexto 6s linear infinite;
  }
  @keyframes brilloTexto {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .subtitulo {
    margin-top: 8px;
    font-size: clamp(0.78rem, 1.5vw, 0.95rem);
    color: var(--azul-neon);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.9;
  }

  .linea-decorativa {
    width: 120px;
    height: 3px;
    margin: 16px auto 0;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--dorado), var(--azul-brillante), var(--dorado), transparent);
    background-size: 200% auto;
    animation: brilloLinea 3s linear infinite;
  }
  @keyframes brilloLinea {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* ===== GRID DE BOTONES ===== */
  .grid-botones {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 100%;
    margin-top: 4px;
  }

  .boton-opcion {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 28px 16px 24px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--texto-claro);
    background: linear-gradient(160deg, rgba(22, 51, 107, 0.85) 0%, rgba(10, 26, 60, 0.9) 100%);
    border: 1px solid rgba(77, 159, 255, 0.22);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.4s ease,
                box-shadow 0.45s ease,
                background 0.45s ease;
    animation: aparecerArriba 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .boton-opcion:nth-child(1) { animation-delay: 0.10s; }
  .boton-opcion:nth-child(2) { animation-delay: 0.20s; }
  .boton-opcion:nth-child(3) { animation-delay: 0.30s; }
  .boton-opcion:nth-child(4) { animation-delay: 0.40s; }
  .boton-opcion:nth-child(5) { animation-delay: 0.50s; }
  .boton-opcion:nth-child(6) { animation-delay: 0.60s; }

  .boton-opcion::before {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  .boton-opcion::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, var(--azul-neon), var(--dorado), var(--azul-brillante));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }

  .boton-opcion:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(77, 159, 255, 0.55);
    box-shadow: var(--sombra-glow), 0 18px 40px rgba(0, 0, 0, 0.45);
    background: linear-gradient(160deg, rgba(30, 68, 140, 0.95) 0%, rgba(12, 32, 74, 0.95) 100%);
  }
  .boton-opcion:hover::before { left: 125%; }
  .boton-opcion:hover::after { opacity: 1; }

  .boton-opcion:active {
    transform: translateY(-3px) scale(0.99);
    transition-duration: 0.1s;
  }

  .icono {
    width: 54px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: linear-gradient(140deg, rgba(42, 109, 244, 0.28), rgba(212, 175, 55, 0.12));
    border: 1px solid rgba(77, 159, 255, 0.3);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.45s ease,
                border-color 0.45s ease;
    position: relative;
    z-index: 1;
  }
  .icono svg {
    width: 26px;
    height: 26px;
    stroke: var(--dorado-claro);
    stroke-width: 1.7;
    fill: none;
    transition: stroke 0.4s ease, transform 0.45s ease;
  }
  .boton-opcion:hover .icono {
    transform: scale(1.15) rotate(-4deg);
    box-shadow: 0 0 28px rgba(212, 175, 55, 0.35);
    border-color: rgba(212, 175, 55, 0.6);
  }
  .boton-opcion:hover .icono svg {
    stroke: #ffffff;
    transform: scale(1.08);
  }

  .etiqueta {
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.3;
    position: relative;
    z-index: 1;
    transition: color 0.35s ease;
  }
  .boton-opcion:hover .etiqueta { color: #ffffff; }

  .sub-etiqueta {
    font-size: 0.66rem;
    color: var(--azul-neon);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    opacity: 0.75;
    position: relative;
    z-index: 1;
    transition: opacity 0.35s ease;
  }
  .boton-opcion:hover .sub-etiqueta { opacity: 1; }

  /* ===== PIE ===== */
  .pie {
    position: relative;
    z-index: 2;
    font-size: 0.72rem;
    color: rgba(232, 238, 252, 0.4);
    letter-spacing: 1px;
    text-align: center;
    animation: aparecerArriba 1s 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes aparecerArriba {
    from {
      opacity: 0;
      transform: translateY(34px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .grid-botones { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .contenedor { gap: 14px; height: auto; min-height: 100vh; padding: 16px 18px 24px; }
    body { overflow-y: auto; overflow-x: hidden; }
    html, body { overflow: auto; }
    .boton-opcion { padding: 22px 14px 18px; }
    .icono { width: 48px; height: 48px; }
    .icono svg { width: 22px; height: 22px; }
    .logo-rrhh { width: clamp(180px, 45vw, 300px); margin-bottom: 25px; }
    .encabezado { margin-top: -10px; }
  }

  @media (max-width: 540px) {
    .grid-botones { grid-template-columns: 1fr; gap: 12px; }
    .subtitulo { letter-spacing: 2px; font-size: 0.7rem; }
    .logo-rrhh { width: clamp(160px, 65vw, 260px); margin-bottom: 20px; }
    .encabezado { margin-top: 0; }
    .boton-opcion {
      flex-direction: row;
      justify-content: flex-start;
      gap: 16px;
      padding: 16px 18px;
      text-align: left;
    }
    .etiqueta { text-align: left; font-size: 0.86rem; }
    .sub-etiqueta { display: none; }
    .icono { flex-shrink: 0; width: 44px; height: 44px; }
    .boton-opcion .texto-grupo { display: flex; flex-direction: column; gap: 3px; }
  }
</style>
</head>

  <script>
    (function () {
      'use strict';

      document.getElementById('anio').textContent = new Date().getFullYear();

      const canvas = document.getElementById('particulas');
      const ctx = canvas.getContext('2d');

      let W = 0, H = 0;
      let particulas = [];
      let animacionId = null;

      const CONFIG = {
        densidad: 16000,
        maxParticulas: 90,
        radioMin: 0.8,
        radioMax: 2.4,
        velocidad: 0.28,
        distanciaConexion: 130,
        colorParticula: 'rgba(120, 180, 255, ',
        colorLinea: 'rgba(90, 150, 245, '
      };

      function ajustarTamano() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function crearParticulas() {
        const cantidad = Math.min(
          CONFIG.maxParticulas,
          Math.floor((W * H) / CONFIG.densidad)
        );
        particulas = [];
        for (let i = 0; i < cantidad; i++) {
          particulas.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: (Math.random() - 0.5) * CONFIG.velocidad * 2,
            vy: (Math.random() - 0.5) * CONFIG.velocidad * 2,
            r: CONFIG.radioMin + Math.random() * (CONFIG.radioMax - CONFIG.radioMin),
            brillo: 0.25 + Math.random() * 0.55
          });
        }
      }

      function dibujar() {
        ctx.clearRect(0, 0, W, H);

        for (let i = 0; i < particulas.length; i++) {
          const p = particulas[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) { p.x = 0; p.vx *= -1; }
          else if (p.x > W) { p.x = W; p.vx *= -1; }
          if (p.y < 0) { p.y = 0; p.vy *= -1; }
          else if (p.y > H) { p.y = H; p.vy *= -1; }
        }

        const distMax = CONFIG.distanciaConexion;
        const distMaxSq = distMax * distMax;
        for (let i = 0; i < particulas.length; i++) {
          const a = particulas[i];
          for (let j = i + 1; j < particulas.length; j++) {
            const b = particulas[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dSq = dx * dx + dy * dy;
            if (dSq < distMaxSq) {
              const alpha = (1 - Math.sqrt(dSq) / distMax) * 0.22;
              ctx.strokeStyle = CONFIG.colorLinea + alpha + ')';
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        for (let i = 0; i < particulas.length; i++) {
          const p = particulas[i];
          ctx.fillStyle = CONFIG.colorParticula + p.brillo + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        animacionId = requestAnimationFrame(dibujar);
      }

      function iniciar() {
        ajustarTamano();
        crearParticulas();
        if (animacionId) cancelAnimationFrame(animacionId);
        dibujar();
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          if (animacionId) {
            cancelAnimationFrame(animacionId);
            animacionId = null;
          }
        } else {
          if (!animacionId) dibujar();
        }
      });

      let resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          ajustarTamano();
          crearParticulas();
        }, 200);
      });

      iniciar();

      const botones = document.querySelectorAll('.boton-opcion');
      botones.forEach(function (btn) {
        btn.addEventListener('pointerdown', function (e) {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          const onda = document.createElement('span');
          onda.style.cssText = [
            'position:absolute',
            'border-radius:50%',
            'pointer-events:none',
            'background:radial-gradient(circle, rgba(212,175,55,0.45) 0%, rgba(77,159,255,0.25) 45%, transparent 70%)',
            'width:10px',
            'height:10px',
            'left:' + (x - 5) + 'px',
            'top:' + (y - 5) + 'px',
            'transform:scale(0)',
            'opacity:1',
            'transition:transform 0.65s cubic-bezier(0.22,1,0.36,1), opacity 0.65s ease',
            'z-index:0'
          ].join(';');

          btn.appendChild(onda);

          requestAnimationFrame(function () {
            const escala = Math.max(rect.width, rect.height) / 5;
            onda.style.transform = 'scale(' + escala + ')';
            onda.style.opacity = '0';
          });

          setTimeout(function () {
            if (onda.parentNode) onda.parentNode.removeChild(onda);
          }, 700);
        });
      });

    })();
  </script>
</body>
</html>
